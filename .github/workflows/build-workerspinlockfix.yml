name: Build WorkerSpinLockFix v2.6.7 progress-gated recovery

on:
  push:
    branches:
      - sitea-v267-progress-budget
    paths:
      - "skyrim-freeze-fix/**"
      - ".github/workflows/build-workerspinlockfix.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2025-vs2026
    defaults:
      run:
        shell: pwsh
        working-directory: skyrim-freeze-fix

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v2.6.7 progress-budget patch
        run: |
          $script = @'
          from pathlib import Path

          p = Path("src/SiteARenderBreaker_v264.cpp")
          s = p.read_text(encoding="utf-8")

          old = "        constexpr std::uint64_t kMaxDeepRecoveryMs = 6000;\n"
          new = "        constexpr std::uint64_t kMaxDeepRecoveryMs = 15000;\n"
          assert s.count(old) == 1, "deep recovery budget anchor mismatch"
          s = s.replace(old, new, 1)

          old = "        constexpr std::uint32_t kTerminalUnwindVerifyMs = 1000;\n"
          new = old + "        constexpr std::uint32_t kZeroCandidateProbeMs = 2000;\n"
          assert s.count(old) == 1, "zero-candidate probe constant anchor mismatch"
          s = s.replace(old, new, 1)

          old = """                const auto deepHandle = beforeSnap.rdi;\n                if (deepHandle == 0 || beforeSnap.r14 != deepHandle) {\n                    logs::error(\n                        \"[SiteARenderBreaker] DEEP RECOVERY ABORTED: RDI/R14 do \"\n                        \"not identify one stable wait event (RDI=0x{:x}, \"\n                        \"R14=0x{:x}, episode={}).\",\n                        beforeSnap.rdi, beforeSnap.r14, a_seq);\n                    return false;\n                }\n"""
          new = """                auto deepHandle = beforeSnap.rdi;\n\n                // v2.6.7 field evidence: a verified signal can advance id 34557\n                // through a transient no-candidate state (RDI=0) before the next\n                // sub-task wait is published. Treat zero as a bounded re-probe\n                // state, not as an event to signal and not as immediate failure.\n                if (deepHandle == 0) {\n                    logs::warn(\n                        \"[SiteARenderBreaker] ZERO-CANDIDATE REPROBE: render join \"\n                        \"has no current deep wait after verified progress; probing \"\n                        \"for up to {} ms before failing closed (episode={}).\",\n                        kZeroCandidateProbeMs, a_seq);\n\n                    bool foundNewWait = false;\n                    for (std::uint32_t waited = 0;\n                         waited < kZeroCandidateProbeMs &&\n                         g_running.load(std::memory_order_relaxed);\n                         waited += kVerifyStepMs)\n                    {\n                        std::this_thread::sleep_for(\n                            std::chrono::milliseconds(kVerifyStepMs));\n\n                        if (!g_in_wait.load(std::memory_order_acquire) ||\n                            g_episode_seq.load(std::memory_order_relaxed) != a_seq)\n                        {\n                            logs::warn(\n                                \"[SiteARenderBreaker] VERIFIED RELEASE DURING \"\n                                \"ZERO-CANDIDATE REPROBE after {} signal(s) \"\n                                \"(episode={}).\", signalCount, a_seq);\n                            return true;\n                        }\n\n                        ThreadSnap probe{};\n                        if (CaptureThread(renderTid, probe) &&\n                            IsInsideRenderTaskJoin(probe) &&\n                            probe.rdi != 0 && probe.r14 == probe.rdi)\n                        {\n                            beforeSnap = probe;\n                            deepHandle = probe.rdi;\n                            foundNewWait = true;\n                            logs::warn(\n                                \"[SiteARenderBreaker] ZERO-CANDIDATE REPROBE \"\n                                \"VERIFIED: new deep wait 0x{:x} appeared; \"\n                                \"continuing normal safety validation \"\n                                \"(episode={}).\", deepHandle, a_seq);\n                            break;\n                        }\n                    }\n\n                    if (!foundNewWait) {\n                        logs::error(\n                            \"[SiteARenderBreaker] ZERO-CANDIDATE REPROBE \"\n                            \"EXHAUSTED: same episode remained active without a \"\n                            \"new validated deep wait for {} ms; failing closed \"\n                            \"(episode={}).\", kZeroCandidateProbeMs, a_seq);\n                        return false;\n                    }\n                }\n\n                if (beforeSnap.r14 != deepHandle) {\n                    logs::error(\n                        \"[SiteARenderBreaker] DEEP RECOVERY ABORTED: RDI/R14 do \"\n                        \"not identify one stable wait event (RDI=0x{:x}, \"\n                        \"R14=0x{:x}, episode={}).\",\n                        beforeSnap.rdi, beforeSnap.r14, a_seq);\n                    return false;\n                }\n"""
          assert s.count(old) == 1, "zero-candidate recovery insertion anchor mismatch"
          s = s.replace(old, new, 1)

          old = '            "[SiteARenderBreaker] armed v2.6.4. id34557 @0x{:x} (+0x{:x}), "\n'
          new = '            "[SiteARenderBreaker] armed v2.6.7. id34557 @0x{:x} (+0x{:x}), "\n'
          assert s.count(old) == 1, "armed-version log anchor mismatch"
          s = s.replace(old, new, 1)

          p.write_text(s, encoding="utf-8")

          policy = Path("src/RecoveryPolicy.h")
          r = policy.read_text(encoding="utf-8")
          anchor = "        static_assert(!WithinBudget(4, 6000, 12, 6000));\n"
          insert = anchor + "        static_assert(WithinBudget(9, 6281, 12, 15000));\n" + \
                   "        static_assert(!WithinBudget(9, 15000, 12, 15000));\n"
          assert r.count(anchor) == 1, "recovery policy regression-test anchor mismatch"
          r = r.replace(anchor, insert, 1)
          policy.write_text(r, encoding="utf-8")

          cm = Path("CMakeLists.txt")
          c = cm.read_text(encoding="utf-8")
          assert c.count("VERSION       2.6.6") == 1, "CMake version anchor mismatch"
          c = c.replace("VERSION       2.6.6", "VERSION       2.6.7", 1)
          old_desc = "v2.6.6 retains the v2.6.5 handoff gate and adds field-validated terminal outer-ack recovery when a verified deep chain exhausts at work-id zero without naturally completing the Site-A episode."
          new_desc = "v2.6.7 retains v2.6.6 terminal recovery, extends verified deep recovery to 15 seconds, and boundedly re-probes transient zero deep-candidate states before failing closed."
          assert old_desc in c, "CMake description anchor mismatch"
          c = c.replace(old_desc, new_desc, 1)
          cm.write_text(c, encoding="utf-8")

          toml = Path("dist/WorkerSpinLockFix.toml")
          t = toml.read_text(encoding="utf-8")
          assert "WorkerSpinLockFix v2.6.6" in t, "TOML version anchor mismatch"
          t = t.replace("WorkerSpinLockFix v2.6.6", "WorkerSpinLockFix v2.6.7", 1)
          t += "\n# v2.6.7: SiteARenderBreaker retains the 12-signal hard ceiling but allows up to\n# 15 seconds while every forced completion continues to produce verified forward\n# progress. A transient RDI=0 state gets a bounded 2-second re-probe; no zero\n# handle is ever signaled, and unchanged safety/protocol gates still fail closed.\n"
          toml.write_text(t, encoding="utf-8")
          '@
          $script | Set-Content -Path "$env:RUNNER_TEMP\apply_v267.py" -Encoding utf8
          python "$env:RUNNER_TEMP\apply_v267.py"
          git diff --check
          git diff -- src/SiteARenderBreaker_v264.cpp src/RecoveryPolicy.h CMakeLists.txt dist/WorkerSpinLockFix.toml

      - name: Persist v2.6.7 source patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/SiteARenderBreaker_v264.cpp src/RecoveryPolicy.h CMakeLists.txt dist/WorkerSpinLockFix.toml
          git commit -m "WorkerSpinLockFix v2.6.7 progress-gated recovery [skip ci]" || echo "No source changes to commit"
          git push origin HEAD:sitea-v267-progress-budget

      - name: Configure environment
        run: |
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          cmake --version
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" version

      - name: Configure
        run: cmake --preset windows-x64-release

      - name: Build
        run: cmake --build --preset windows-x64-release -- /m

      - name: Verify built binary
        run: |
          $dll = Get-ChildItem -Path "C:\sk\wslf\r" -Recurse -Filter "WorkerSpinLockFix.dll" | Select-Object -First 1
          if (-not $dll) { throw "WorkerSpinLockFix.dll not found" }
          $bytes = [System.IO.File]::ReadAllBytes($dll.FullName)
          $ascii = [System.Text.Encoding]::ASCII.GetString($bytes)
          if ($ascii -notmatch "2\.6\.7") { throw "Built DLL does not contain v2.6.7 version marker" }
          Get-FileHash $dll.FullName -Algorithm SHA256

      - name: Collect artifacts
        run: |
          $out = Join-Path $env:GITHUB_WORKSPACE "artifact"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $dll = Get-ChildItem -Path "C:\sk\wslf\r" -Recurse -Filter "WorkerSpinLockFix.dll" | Select-Object -First 1
          $pdb = Get-ChildItem -Path "C:\sk\wslf\r" -Recurse -Filter "WorkerSpinLockFix.pdb" | Select-Object -First 1
          if (-not $dll) { throw "WorkerSpinLockFix.dll not found" }
          if (-not $pdb) { throw "WorkerSpinLockFix.pdb not found" }
          Copy-Item $dll.FullName (Join-Path $out "WorkerSpinLockFix.dll")
          Copy-Item $pdb.FullName (Join-Path $out "WorkerSpinLockFix.pdb")
          Copy-Item "dist\WorkerSpinLockFix.toml" (Join-Path $out "WorkerSpinLockFix.toml")
          Get-FileHash (Join-Path $out "WorkerSpinLockFix.dll") -Algorithm SHA256
          Get-ChildItem $out | Format-Table Name,Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WorkerSpinLockFix-v2.6.7
          path: artifact/*
          if-no-files-found: error
