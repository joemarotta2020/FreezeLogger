name: Build WorkerSpinLockFix v2.6.7 progress window

on:
  push:
    branches:
      - sitea-v267-progress-window
    paths:
      - "skyrim-freeze-fix/**"
      - ".github/workflows/build-workerspinlockfix.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2025-vs2026
    defaults:
      run:
        shell: pwsh
        working-directory: skyrim-freeze-fix

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v2.6.7 zero-candidate timing refinement
        run: |
          $script = @'
          from pathlib import Path
          p = Path("src/SiteARenderBreaker_v264.cpp")
          s = p.read_text(encoding="utf-8")

          marker = "lastProgressMs = NowMs(); // zero-candidate transition is verified movement"
          if marker not in s:
              old = """                if (RecoveryPolicy::ShouldReprobeZeroCandidate(after, signalCount)) {\n                    logs::warn(\n"""
              new = """                if (RecoveryPolicy::ShouldReprobeZeroCandidate(after, signalCount)) {\n                    lastProgressMs = NowMs(); // zero-candidate transition is verified movement\n                    logs::warn(\n"""
              assert s.count(old) == 1, "zero-candidate progress reset anchor mismatch"
              s = s.replace(old, new, 1)

              old = """                    for (std::uint32_t waited = 0;\n                         waited < kZeroCandidateReprobeMs &&\n                         g_running.load(std::memory_order_relaxed);\n"""
              new = """                    for (std::uint32_t waited = 0;\n                         waited < kZeroCandidateReprobeMs &&\n                         NowMs() - recoveryStart < kMaxDeepRecoveryMs &&\n                         g_running.load(std::memory_order_relaxed);\n"""
              assert s.count(old) == 1, "zero-candidate absolute ceiling anchor mismatch"
              s = s.replace(old, new, 1)
              p.write_text(s, encoding="utf-8")
          '@
          $script | Set-Content -Path "$env:RUNNER_TEMP\refine_v267.py" -Encoding utf8
          python "$env:RUNNER_TEMP\refine_v267.py"
          git diff --check
          git diff -- src/SiteARenderBreaker_v264.cpp

      - name: Persist refinement
        run: |
          if (git status --porcelain -- src/SiteARenderBreaker_v264.cpp) {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/SiteARenderBreaker_v264.cpp
            git commit -m "Refine v2.6.7 zero-candidate progress timing"
            git push origin HEAD:sitea-v267-progress-window
          } else {
            echo "v2.6.7 timing refinement already committed"
          }

      - name: Configure environment
        run: |
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          cmake --version
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" version

      - name: Configure
        run: cmake --preset windows-x64-release

      - name: Build
        run: cmake --build --preset windows-x64-release -- /m

      - name: Collect artifacts
        run: |
          $out = Join-Path $env:GITHUB_WORKSPACE "artifact"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $dll = Get-ChildItem -Path "C:\sk\wslf\r" -Recurse -Filter "WorkerSpinLockFix.dll" | Select-Object -First 1
          $pdb = Get-ChildItem -Path "C:\sk\wslf\r" -Recurse -Filter "WorkerSpinLockFix.pdb" | Select-Object -First 1
          if (-not $dll) { throw "WorkerSpinLockFix.dll not found" }
          if (-not $pdb) { throw "WorkerSpinLockFix.pdb not found" }
          Copy-Item $dll.FullName (Join-Path $out "WorkerSpinLockFix.dll")
          Copy-Item $pdb.FullName (Join-Path $out "WorkerSpinLockFix.pdb")
          Copy-Item "dist\WorkerSpinLockFix.toml" (Join-Path $out "WorkerSpinLockFix.toml")
          Get-FileHash (Join-Path $out "WorkerSpinLockFix.dll") -Algorithm SHA256
          Get-ChildItem $out | Format-Table Name,Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WorkerSpinLockFix-v2.6.7
          path: artifact/*
          if-no-files-found: error
