# WorkerSpinLockFix v2.6.4 - field diagnostic/recovery profile
# Read once at SKSEPlugin_Load; restart Skyrim after changing this file.

[plugin]
enabled = true

[log]
stats_interval_s = 60

[phase4_defer]
enabled = true
diagnostic_logging = false

# The 2026-10-06 capture field-validated the exact stalled-intact signature:
# main remained in WaitForJobTask with zero progress for >7 s. v2.6.4 makes
# this path active and verifies that the wrapped wait actually returns after
# SetEvent before recording a successful recovery.
[job_wait_breaker]
enabled = true
detect_only = false
dwell_threshold_ms = 5000
poll_interval_ms = 1000
recheck_window_ms = 1500
diagnostic_logging = true

# Keep the older main-side Site-A path observational until a matching episode
# is captured with the current diagnostics.
[site_a_breaker]
enabled = true
detect_only = true
dwell_threshold_ms = 5000
poll_interval_ms = 1000
recheck_window_ms = 1500
diagnostic_logging = true

# Active SE 1.5.97 deep recovery. The old four-signal cap is replaced by a
# dual budget (12 signals / 6000 ms) but continuation is allowed ONLY when the
# previous signal demonstrably advances id 34557 to a new unsignaled event
# while episode, work-id and outer ack remain unchanged. Repeats, no-progress,
# protocol mutation, invalid handles, or budget exhaustion abort recovery.
[site_a_render_breaker]
enabled = true
detect_only = false
dwell_threshold_ms = 5000
poll_interval_ms = 1000
recheck_window_ms = 1500
diagnostic_logging = true

# Leave force-release detect-only. This is a different failure class and the
# 2026-10-06 episode was a job/join chain stall, not a proven leaked lock.
[leaked_spinlock_breaker]
enabled = true
detect_only = true
dwell_threshold_ms = 5000
poll_interval_ms = 1000
recheck_window_ms = 1500
diagnostic_logging = false
